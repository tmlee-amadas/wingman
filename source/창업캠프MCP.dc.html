<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin:0; padding:0; background:#f5f5f7; scroll-behavior:smooth; }
    body {
      font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", "Inter", sans-serif;
      -webkit-font-smoothing:antialiased;
      color:#1d1d1f;
      letter-spacing:-0.012em;
    }
    @keyframes pulseDot { 0%,100%{opacity:0.5; transform:scale(1);} 50%{opacity:1; transform:scale(1.3);} }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.15); border-radius:8px; border:2px solid transparent; background-clip:content-box; }
    select.sd-select {
      appearance:none;
      -webkit-appearance:none;
      font-family:inherit;
      font-size:13px;
      font-weight:500;
      color:#1d1d1f;
      background:#fff;
      border:1px solid rgba(0,0,0,0.12);
      border-radius:10px;
      padding:10px 36px 10px 14px;
      cursor:pointer;
      width:100%;
      letter-spacing:-0.01em;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1.5L6 6.5L11 1.5' stroke='%2386868b' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat:no-repeat;
      background-position:right 14px center;
    }
    select.sd-select:focus { outline:none; border-color:#0071e3; box-shadow:0 0 0 3px rgba(0,113,227,0.15); }
  </style>
</helmet>

</html>
